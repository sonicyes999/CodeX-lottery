<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>抽獎管理系統</title>
  <style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #111827;
  --muted: #6b7280;
  --accent: #2563eb;
  --accent-2: #1d4ed8;
  --line: #e5e7eb;
  --result-bg: #0f172a;
  --result-text: #e2e8f0;
}

body[data-theme="theme-ocean"] {
  --bg: #f4f6fb; --card: #ffffff; --text: #111827; --muted: #6b7280;
  --accent: #2563eb; --accent-2: #1d4ed8; --line: #dbe4ff;
  --result-bg: #0f172a; --result-text: #e2e8f0;
}
body[data-theme="theme-sunset"] {
  --bg: #fff7ed; --card: #ffffff; --text: #3f1f0d; --muted: #8a5a3a;
  --accent: #ea580c; --accent-2: #c2410c; --line: #fed7aa;
  --result-bg: #3f1f0d; --result-text: #fff7ed;
}
body[data-theme="theme-forest"] {
  --bg: #f0fdf4; --card: #ffffff; --text: #052e16; --muted: #3f6b58;
  --accent: #15803d; --accent-2: #166534; --line: #bbf7d0;
  --result-bg: #052e16; --result-text: #dcfce7;
}
body[data-theme="theme-grape"] {
  --bg: #faf5ff; --card: #ffffff; --text: #3b0764; --muted: #6b3f85;
  --accent: #7e22ce; --accent-2: #6b21a8; --line: #e9d5ff;
  --result-bg: #2e1065; --result-text: #f3e8ff;
}
body[data-theme="theme-rose"] {
  --bg: #fff1f2; --card: #ffffff; --text: #4c0519; --muted: #88425b;
  --accent: #e11d48; --accent-2: #be123c; --line: #fecdd3;
  --result-bg: #4c0519; --result-text: #ffe4e6;
}
body[data-theme="theme-midnight"] {
  --bg: #020617; --card: #0f172a; --text: #e2e8f0; --muted: #94a3b8;
  --accent: #38bdf8; --accent-2: #0ea5e9; --line: #1e293b;
  --result-bg: #020617; --result-text: #bae6fd;
}

* { box-sizing: border-box; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

body, .card, button, textarea, .result, header, .status {
  transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
}

body {
  margin: 0;
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color: var(--text);
  background: radial-gradient(circle at top right, color-mix(in srgb, var(--accent) 18%, var(--bg)) 0%, var(--bg) 45%);
}

header {
  padding: 20px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent));
  background-size: 200% 200%;
  animation: gradientShift 8s ease infinite;
  color: #fff;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
}
header h1 { margin: 0 0 8px; }
header p { margin: 0; opacity: 0.95; }

.header-top {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  gap: 12px;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
}

.theme-box {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 180px;
}
.theme-box label { font-size: 0.9rem; }
.theme-box select {
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.4);
  padding: 8px;
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
  backdrop-filter: blur(3px);
}
.theme-box option { color: #111827; }

.layout {
  max-width: 1100px;
  margin: 16px auto 32px;
  padding: 0 16px;
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
}

.card {
  background: color-mix(in srgb, var(--card) 88%, transparent);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
  backdrop-filter: blur(6px);
  animation: fadeInUp 280ms ease;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 22px rgba(0, 0, 0, 0.08);
}

.card.full { grid-column: 1 / -1; }

h2 { margin-top: 0; font-size: 1.1rem; }
.hint { color: var(--muted); font-size: 0.9rem; }
textarea {
  width: 100%;
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  font-size: 14px;
  resize: vertical;
  color: var(--text);
  background: var(--card);
}
.row {
  margin-top: 10px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
button {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  border-radius: 999px;
  padding: 8px 12px;
  cursor: pointer;
}
button:hover {
  transform: translateY(-1px);
  filter: brightness(0.99);
}
button.primary {
  background: var(--accent);
  color: #fff;
  border: 1px solid var(--accent);
  box-shadow: 0 6px 14px color-mix(in srgb, var(--accent) 40%, transparent);
}
button.primary:hover { background: var(--accent-2); }

.summary {
  margin-top: 10px;
  font-size: 0.92rem;
  color: var(--muted);
  white-space: pre-wrap;
}
.status {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
  background: color-mix(in srgb, var(--card) 92%, transparent);
}
.status.success { border-color: color-mix(in srgb, #10b981 35%, var(--line)); }
.status.error { border-color: color-mix(in srgb, #ef4444 45%, var(--line)); }
.status.info { border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
.status.pop { animation: fadeInUp 220ms ease; }

.result {
  margin: 10px 0 0;
  background: var(--result-bg);
  color: var(--result-text);
  border-radius: 10px;
  padding: 12px;
  min-height: 160px;
  overflow: auto;
}
.result.reveal { animation: fadeInUp 260ms ease; }

  </style>
</head>
<body data-theme="theme-ocean">
  <header>
    <div class="header-top">
      <div>
        <h1>抽獎管理系統</h1>
        <p>支援後台管理、多獎項、權重抽獎、一鍵複製與下載名單。</p>
      </div>
      <div class="theme-box">
        <label for="themeSelect">佈景主題</label>
        <select id="themeSelect">
          <option value="theme-ocean">海洋藍</option>
          <option value="theme-sunset">夕陽橘</option>
          <option value="theme-forest">森林綠</option>
          <option value="theme-grape">葡萄紫</option>
          <option value="theme-rose">玫瑰粉</option>
          <option value="theme-midnight">午夜暗色</option>
        </select>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="card">
      <h2>1) 參與者管理</h2>
      <p class="hint">格式：每行一位，<code>姓名,編號,權重</code>。權重可省略，預設 1。</p>
      <textarea id="participantsInput" rows="8" placeholder="王小明,001,1\n陳小華,002,3\n林小美,003,2">王小明,001,1
陳小華,002,3
林小美,003,2
張大華,004,5
李小安,005,2
吳小婷,006,1</textarea>
      <div class="row">
        <button id="loadParticipantsBtn">載入名單</button>
        <button id="loadDemoBtn">重新載入測試資料</button>
        <button id="copyParticipantsBtn">一鍵複製名單</button>
        <button id="downloadParticipantsBtn">下載名單 CSV</button>
      </div>
      <div id="participantsSummary" class="summary"></div>
    </section>

    <section class="card">
      <h2>2) 獎項管理</h2>
      <p class="hint">格式：每行一個獎項，<code>獎項名稱,名額</code>。</p>
      <textarea id="prizesInput" rows="6" placeholder="頭獎,1\n二獎,2\n三獎,3">頭獎,1
二獎,2
三獎,3</textarea>
      <div class="row">
        <button id="loadPrizesBtn">載入獎項</button>
      </div>
      <div id="prizesSummary" class="summary"></div>
    </section>

    <section class="card">
      <h2>3) 抽獎設定</h2>
      <div class="row">
        <label><input type="checkbox" id="allowRepeat" /> 允許重複中獎</label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="useWeight" checked /> 啟用權重抽獎</label>
      </div>
      <div class="row">
        <button id="drawAllBtn" class="primary">開始抽獎（全部獎項）</button>
        <button id="resetBtn">清除資料</button>
      </div>
      <div id="status" class="summary status info">準備就緒，請開始抽獎 ✨</div>
    </section>

    <section class="card full">
      <h2>4) 抽獎結果</h2>
      <div class="row">
        <button id="copyWinnersBtn">一鍵複製中獎名單</button>
        <button id="downloadWinnersBtn">下載中獎名單 CSV</button>
      </div>
      <pre id="resultOutput" class="result">尚未抽獎</pre>
    </section>
  </main>

  <script>
const state = {
  participants: [],
  prizes: [],
  winners: []
};

const $ = (id) => document.getElementById(id);

const THEME_KEY = "lottery_theme";

const DEMO_PARTICIPANTS = [
  "王小明,001,1",
  "陳小華,002,3",
  "林小美,003,2",
  "張大華,004,5",
  "李小安,005,2",
  "吳小婷,006,1"
].join("\n");

const DEMO_PRIZES = ["頭獎,1", "二獎,2", "三獎,3"].join("\n");

function setStatus(message, type = "info") {
  const status = $("status");
  status.textContent = message;
  status.className = `summary status ${type}`;
  status.classList.remove("pop");
  requestAnimationFrame(() => status.classList.add("pop"));
}

function initTheme() {
  const select = $("themeSelect");
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) {
    document.body.setAttribute("data-theme", saved);
    select.value = saved;
  }

  const onThemeChange = (theme) => {
    document.body.setAttribute("data-theme", theme);
    localStorage.setItem(THEME_KEY, theme);
    setStatus(`🎨 已切換主題：${select.options[select.selectedIndex].text}`, "success");
  };

  select.addEventListener("input", (e) => onThemeChange(e.target.value));
  select.addEventListener("change", (e) => onThemeChange(e.target.value));
}

function parseParticipants(raw) {
  return raw
    .split(/\n+/)
    .map((line) => line.trim())
    .filter(Boolean)
    .map((line, idx) => {
      const [name, id, weightRaw] = line.split(",").map((v) => (v || "").trim());
      if (!name || !id) throw new Error(`第 ${idx + 1} 行格式錯誤，需包含 姓名,編號`);
      const weight = Math.max(1, Number(weightRaw || "1"));
      if (!Number.isFinite(weight)) throw new Error(`第 ${idx + 1} 行權重無效`);
      return { name, id, weight };
    });
}

function parsePrizes(raw) {
  return raw
    .split(/\n+/)
    .map((line) => line.trim())
    .filter(Boolean)
    .map((line, idx) => {
      const [name, countRaw] = line.split(",").map((v) => (v || "").trim());
      if (!name || !countRaw) throw new Error(`獎項第 ${idx + 1} 行格式錯誤，需為 獎項名稱,名額`);
      const count = Number(countRaw);
      if (!Number.isInteger(count) || count <= 0) throw new Error(`獎項第 ${idx + 1} 行名額必須為正整數`);
      return { name, count };
    });
}

function weightedPick(pool) {
  const total = pool.reduce((sum, p) => sum + p.weight, 0);
  let r = Math.random() * total;
  for (const p of pool) {
    r -= p.weight;
    if (r <= 0) return p;
  }
  return pool[pool.length - 1];
}

function simplePick(pool) {
  return pool[Math.floor(Math.random() * pool.length)];
}

function runDraw({ allowRepeat, useWeight }) {
  if (!state.participants.length) throw new Error("請先載入參與者");
  if (!state.prizes.length) throw new Error("請先載入獎項");

  const available = [...state.participants];
  const winners = [];

  for (const prize of state.prizes) {
    const prizeWinners = [];
    for (let i = 0; i < prize.count; i += 1) {
      if (!available.length) throw new Error("可抽名單不足，請啟用重複中獎或減少名額");

      const picked = useWeight ? weightedPick(available) : simplePick(available);
      prizeWinners.push(picked);

      if (!allowRepeat) {
        const index = available.findIndex((p) => p.id === picked.id);
        if (index >= 0) available.splice(index, 1);
      }
    }
    winners.push({ prize: prize.name, people: prizeWinners });
  }

  return winners;
}

function winnersToText(winners) {
  const lines = [];
  winners.forEach((group) => {
    lines.push(`【${group.prize}】`);
    group.people.forEach((p, i) => lines.push(`${i + 1}. ${p.name} (${p.id}) 權重=${p.weight}`));
    lines.push("");
  });
  return lines.join("\n").trim();
}

function toCsv(rows, headers) {
  const escape = (v) => {
    const s = String(v ?? "");
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const head = headers.join(",");
  const body = rows.map((r) => headers.map((h) => escape(r[h])).join(",")).join("\n");
  return `${head}\n${body}`;
}

function download(filename, text) {
  const blob = new Blob([text], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

async function copyText(text) {
  await navigator.clipboard.writeText(text);
}

function loadDemoData() {
  $("participantsInput").value = DEMO_PARTICIPANTS;
  $("prizesInput").value = DEMO_PRIZES;

  state.participants = parseParticipants(DEMO_PARTICIPANTS);
  state.prizes = parsePrizes(DEMO_PRIZES);

  $("participantsSummary").textContent = `已載入 ${state.participants.length} 位參與者（測試資料）`;
  const totalSeats = state.prizes.reduce((n, p) => n + p.count, 0);
  $("prizesSummary").textContent = `已載入 ${state.prizes.length} 個獎項，總名額 ${totalSeats}（測試資料）`;
  setStatus("✅ 已載入預設測試資料，可直接抽獎", "success");
}

function bindEvents() {
  $("loadParticipantsBtn").addEventListener("click", () => {
    try {
      state.participants = parseParticipants($("participantsInput").value);
      $("participantsSummary").textContent = `已載入 ${state.participants.length} 位參與者`;
      setStatus("參與者名單已更新", "success");
    } catch (err) {
      setStatus(`❌ ${err.message}`, "error");
    }
  });

  $("loadDemoBtn").addEventListener("click", () => {
    try {
      loadDemoData();
    } catch (err) {
      setStatus(`❌ ${err.message}`, "error");
    }
  });

  $("loadPrizesBtn").addEventListener("click", () => {
    try {
      state.prizes = parsePrizes($("prizesInput").value);
      const totalSeats = state.prizes.reduce((n, p) => n + p.count, 0);
      $("prizesSummary").textContent = `已載入 ${state.prizes.length} 個獎項，總名額 ${totalSeats}`;
      setStatus("獎項設定已更新", "success");
    } catch (err) {
      setStatus(`❌ ${err.message}`, "error");
    }
  });

  $("drawAllBtn").addEventListener("click", () => {
    try {
      state.winners = runDraw({
        allowRepeat: $("allowRepeat").checked,
        useWeight: $("useWeight").checked
      });
      $("resultOutput").textContent = winnersToText(state.winners);
      $("resultOutput").classList.remove("reveal");
      requestAnimationFrame(() => $("resultOutput").classList.add("reveal"));
      setStatus("🎉 抽獎完成", "success");
    } catch (err) {
      setStatus(`❌ ${err.message}`, "error");
    }
  });

  $("copyParticipantsBtn").addEventListener("click", async () => {
    const text = $("participantsInput").value.trim();
    if (!text) return;
    await copyText(text);
    setStatus("✅ 已複製參與者名單", "success");
  });

  $("copyWinnersBtn").addEventListener("click", async () => {
    if (!state.winners.length) return;
    await copyText(winnersToText(state.winners));
    setStatus("✅ 已複製中獎名單", "success");
  });

  $("downloadParticipantsBtn").addEventListener("click", () => {
    if (!state.participants.length) return;
    download("participants.csv", toCsv(state.participants, ["name", "id", "weight"]));
    setStatus("✅ 已下載參與者名單", "success");
  });

  $("downloadWinnersBtn").addEventListener("click", () => {
    if (!state.winners.length) return;
    const rows = [];
    state.winners.forEach((w) => w.people.forEach((p) => rows.push({ prize: w.prize, name: p.name, id: p.id, weight: p.weight })));
    download("winners.csv", toCsv(rows, ["prize", "name", "id", "weight"]));
    setStatus("✅ 已下載中獎名單", "success");
  });

  $("resetBtn").addEventListener("click", () => {
    state.participants = [];
    state.prizes = [];
    state.winners = [];
    $("participantsSummary").textContent = "";
    $("prizesSummary").textContent = "";
    $("resultOutput").textContent = "尚未抽獎";
    setStatus("已清除資料", "info");
  });
}

initTheme();
bindEvents();
loadDemoData();

  </script>
</body>
</html>
